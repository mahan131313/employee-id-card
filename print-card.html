<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<title>چاپ کارت پرسنلی</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>


<style>

@page {

  size:A4;

  margin:10mm;

}


*{

  box-sizing:border-box;

}


body{

  font-family:Tahoma,sans-serif;

  margin:0;

  background:#fff;

}



/* هر صفحه A4 - 8 کارت */

.page{

  display:grid;

  grid-template-columns:repeat(2,85.6mm);

  grid-template-rows:repeat(4,54mm);

  column-gap:8mm;

  justify-content:center;

  align-content:space-between;

  height:277mm;

  page-break-after:always;

}



/* کارت PVC */

.card{

  width:85.6mm;

  height:54mm;

  border-radius:4mm;

  overflow:hidden;

  display:flex;

  direction:ltr;

  position:relative;

  page-break-inside:avoid;


  background:

  linear-gradient(

  135deg,

  #0D47A1,

  #1976D2,

  #42A5F5

  );


  outline:0.2mm dashed #999;

  outline-offset:3mm;

}



/* تزئین پس زمینه */

.card::before{

  content:"";

  position:absolute;

  width:40mm;

  height:40mm;

  border-radius:50%;

  background:rgba(255,255,255,.15);

  top:-18mm;

  right:-12mm;

}


.card::after{

  content:"";

  position:absolute;

  width:30mm;

  height:30mm;

  border-radius:50%;

  background:rgba(255,255,255,.1);

  bottom:-12mm;

  left:-10mm;

}



/* عکس */

.photo{

  width:45%;

  height:100%;

  display:flex;

  align-items:center;

  justify-content:center;

  padding:6mm;

  z-index:2;

}


.photo img{

  width:34mm;

  height:34mm;

  object-fit:cover;

  border-radius:50%;

  background:#fff;

  padding:1.5mm;

}



/* QR */

.qr{

  width:55%;

  height:100%;

  display:flex;

  flex-direction:column;

  justify-content:center;

  align-items:center;

  z-index:2;

}



.qr div[id^="qr-"]{

  background:#fff;

  padding:3mm;

  border-radius:3mm;

}



.qr img{

  width:32mm!important;

  height:32mm!important;

}



/* کد شناسایی */

.code{

  margin-top:3mm;

  background:#fff;

  color:#0D47A1;

  padding:1.5mm 5mm;

  border-radius:10mm;

  font-size:13px;

  font-weight:bold;

  direction:ltr;

}



</style>

</head>


<body>


<div id="cards"></div>



<script>


fetch("data.json")

.then(response=>response.json())

.then(data=>{


let main=document.getElementById("cards");

let page=null;


data.forEach((person,index)=>{


if(index % 8 === 0){


page=document.createElement("div");

page.className="page";

main.appendChild(page);


}



let card=document.createElement("div");

card.className="card";



card.innerHTML=`

<div class="photo">

<img src="${person.photo || person.id+'.png'}">

</div>


<div class="qr">

<div id="qr-${person.id}"></div>

<div class="code">

${person.id}

</div>

</div>

`;



page.appendChild(card);



new QRCode(

document.getElementById("qr-"+person.id),

{

text:

"https://mahan131313.github.io/employee-id-card/?id="+person.id,

width:140,

height:140

}

);



});


});


</script>


</body>

</html>
