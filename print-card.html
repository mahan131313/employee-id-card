<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>چاپ کارت پرسنلی</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>

@page {
  size: A4;
  margin: 10mm;
}

body {
  font-family: Tahoma;
}

.page {
  display: grid;
  grid-template-columns: repeat(2, 85.6mm);
  grid-template-rows: repeat(4, 54mm);
  gap: 5mm;
  justify-content: center;
}

.card {
  width: 85.6mm;
  height: 54mm;
  border: 1px solid #000;
  display: flex;
  flex-direction: row;
  direction: ltr;
  overflow: hidden;
  page-break-inside: avoid;
}

.photo {
  width: 50%;
  height: 100%;
}

.photo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.qr {
  width: 50%;
  direction: rtl;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

.qr img {
  width: 120px;
  height: 120px;
}

.code {
  margin-top: 5px;
  font-size: 16px;
  font-weight: bold;
}

</style>

</head>

<body>

<div class="page" id="cards"></div>


<script>

fetch("data.json")
.then(response => response.json())
.then(data => {

  let container = document.getElementById("cards");

  data.forEach(person => {

    let card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      <div class="photo">
        <img src="${person.photo || person.id + '.png'}">
      </div>

      <div class="qr">
        <div id="qr-${person.id}"></div>
        <div class="code">${person.id}</div>
      </div>
    `;

    container.appendChild(card);


    new QRCode(document.getElementById("qr-" + person.id), {
      text: "https://mahan131313.github.io/employee-id-card/?id=" + person.id,
      width: 120,
      height: 120
    });

  });

});

</script>

</body>
</html>
